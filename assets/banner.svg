<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ashikul Islam - Software Engineer and System Architect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a3a"/>
      <stop offset="1" stop-color="#1a1346"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow1)"/>
    <rect width="1200" height="300" fill="url(#glow2)"/>

    <!-- architecture motif: connected nodes -->
    <g stroke="url(#accent)" stroke-opacity="0.55" stroke-width="1.5" fill="none">
      <path d="M900 70 L1010 130 L1120 80"/>
      <path d="M1010 130 L960 220 L1090 225"/>
      <path d="M960 220 L900 70"/>
    </g>
    <g fill="#0b1020" stroke="url(#accent)" stroke-width="2">
      <circle cx="900" cy="70" r="9"/>
      <circle cx="1010" cy="130" r="13"/>
      <circle cx="1120" cy="80" r="8"/>
      <circle cx="960" cy="220" r="10"/>
      <circle cx="1090" cy="225" r="7"/>
    </g>
    <circle cx="1010" cy="130" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- text -->
    <text x="70" y="125" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="62" font-weight="800" fill="#f8fafc" letter-spacing="-1">Ashikul Islam</text>
    <text x="72" y="175" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="url(#accent)" letter-spacing="1">Software Engineer  ·  System Architect</text>
    <text x="72" y="215" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="18" fill="#94a3b8">Building scalable backends and cloud-native systems</text>

    <rect x="72" y="238" width="120" height="4" rx="2" fill="url(#accent)"/>
  </g>
</svg>
